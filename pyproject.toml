[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sarov-schedule-skt225"
version = "1.0.0"
description = "Безопасная публикация расписания второго курса филиала МГУ в Сарове"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["requests>=2.32.0,<3"]

[project.scripts]
sarov-schedule-fetch = "sarov_schedule.cli:main"
sarov-schedule-validate = "sarov_schedule.validate:main"

[tool.setuptools.packages.find]
where = ["src"]
