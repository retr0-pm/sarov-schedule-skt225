name: Fetch Sarov schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "schema/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/fetch.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "schema/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/fetch.yml"

permissions:
  contents: read

concurrency:
  group: sarov-schedule-skt225-fetch
  cancel-in-progress: true

env:
  ARTIFACT_RETENTION_DAYS: "1"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --disable-pip-version-check -r requirements.txt -e .

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Fetch complete second-course schedule
        run: sarov-schedule-fetch --output output

      - name: Validate downloaded PDFs
        run: sarov-schedule-validate output

      - name: Recognize SKT-225 schedule and apply skt225-v3 rules
        run: sarov-schedule-recognize output

      - name: Validate structured schedule
        run: sarov-schedule-validate --require-schedule output

      - name: Upload short-lived artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarov-schedule
          path: output/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          compression-level: 0
          if-no-files-found: error
