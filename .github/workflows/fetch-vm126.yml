name: Fetch VM-126 schedule

on:
  workflow_dispatch:
    inputs:
      calendar_mode:
        description: Calendar execution mode
        type: choice
        options: [dry-run, off, apply]
        default: dry-run
  schedule:
    - cron: "27 * * * *"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "schema/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/fetch-vm126.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "schema/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/fetch-vm126.yml"

permissions:
  contents: read

concurrency:
  group: sarov-schedule-vm126-${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
  cancel-in-progress: false

env:
  ARTIFACT_RETENTION_DAYS: "1"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --disable-pip-version-check -r requirements.txt -e .

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Fetch complete first-course schedule
        run: sarov-schedule-fetch --course 1 --output output

      - name: Validate downloaded PDFs
        run: sarov-schedule-validate --profile vm126 output

      - name: Recognize VM-126 schedule and apply vm126-v1 rules
        run: sarov-schedule-recognize --profile vm126 output

      - name: Validate structured schedule
        run: sarov-schedule-validate --profile vm126 --require-schedule output

      - name: Upload short-lived artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarov-schedule-vm126
          path: output/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          compression-level: 0
          if-no-files-found: error

      - name: Select calendar mode
        id: calendar_mode
        if: success()
        env:
          REQUESTED: ${{ inputs.calendar_mode }}
          CONFIGURED: ${{ vars.VM126_SYNC_MODE || 'off' }}
        run: |
          mode=off
          if [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request ]]; then
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              mode="$REQUESTED"
            elif [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
              mode="$CONFIGURED"
            fi
          fi
          if [[ "$mode" == apply && "$CONFIGURED" != apply ]]; then
            echo "::error::Set VM126_SYNC_MODE=apply after approving the verified dry-run."
            exit 1
          fi
          case "$mode" in off|dry-run|apply) ;; *) exit 1 ;; esac
          echo "value=$mode" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Calendar with Workload Identity Federation
        id: google_auth
        if: success() && steps.calendar_mode.outputs.value != 'off' && vars.VM126_GOOGLE_WIF_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.VM126_GOOGLE_WIF_PROVIDER }}
          service_account: ${{ vars.VM126_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s
          access_token_scopes: ${{ steps.calendar_mode.outputs.value == 'apply' && 'https://www.googleapis.com/auth/calendar.events' || 'https://www.googleapis.com/auth/calendar.events.readonly' }}
          create_credentials_file: false
          export_environment_variables: false

      - name: Reconcile the calendar
        if: success() && steps.calendar_mode.outputs.value != 'off'
        env:
          MODE: ${{ steps.calendar_mode.outputs.value }}
          VM126_GOOGLE_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          VM126_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ vars.VM126_GOOGLE_WIF_PROVIDER == '' && secrets.VM126_GOOGLE_SERVICE_ACCOUNT_JSON || '' }}
          VM126_GOOGLE_CALENDAR_ID: ${{ vars.VM126_GOOGLE_CALENDAR_ID }}
          ALLOW_DELETIONS: ${{ vars.VM126_ALLOW_DELETIONS }}
        run: |
          args=()
          if [[ "$MODE" == apply && "$ALLOW_DELETIONS" == true ]]; then args+=(--allow-deletes); fi
          sarov-schedule-calendar --profile vm126 output --mode "$MODE" --report sync-report.json "${args[@]}"

      - name: Validate and report with calendar disabled
        if: success() && steps.calendar_mode.outputs.value == 'off'
        run: sarov-schedule-calendar --profile vm126 output --mode off --report sync-report.json

      - name: Report an upstream failure
        if: failure()
        run: |
          if [[ ! -s sync-report.json ]]; then
            jq -n '{schema_version:1, started_at:(now|todate), run_id:env.GITHUB_RUN_ID, run_attempt:env.GITHUB_RUN_ATTEMPT,
              sha:env.GITHUB_SHA, mode:"off", status:"error", validation:"failed", manifest_fingerprint:null,
              expected:0, managed:0, created:0, updated:0, deleted:0, unchanged:0, conflicts:0, verified:false,
              errors:["upstream_or_configuration_failed"], changes:[], planned:[]}' > sync-report.json
            echo "### ВМ-126 · fetch, validation or configuration failed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload compact sync report
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: sync-report
          path: sync-report.json
          retention-days: 7
          if-no-files-found: error

  publish-report:
    needs: fetch
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sync-report
      - name: Publish latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_BRANCH: vm126-sync-reports
        run: |
          api="repos/$GITHUB_REPOSITORY"
          if ! gh api "$api/git/ref/heads/$REPORT_BRANCH" --silent; then
            gh api "$api/git/refs" -f ref="refs/heads/$REPORT_BRANCH" -f sha="$GITHUB_SHA" --silent
          fi
          if gh api "$api/contents/latest.json?ref=$REPORT_BRANCH" > previous.json 2> previous.err; then
            prior=$(jq -r '.content' previous.json | base64 -d | jq -r '.run_id // "0"')
            if [[ "$prior" =~ ^[0-9]+$ ]] && (( prior > GITHUB_RUN_ID )); then exit 0; fi
            sha=$(jq -er '.sha' previous.json)
            args=(-f sha="$sha")
          else
            if ! grep -q 'HTTP 404' previous.err; then exit 1; fi
            args=()
          fi
          gh api "$api/contents/latest.json" --method PUT -f branch="$REPORT_BRANCH" \
            -f message="Calendar report for run $GITHUB_RUN_ID" -f content="$(base64 -w0 sync-report.json)" \
            "${args[@]}" --silent
